# ------------------------------------------------------------
# Theory
# ------------------------------------------------------------
theory:
  camb:
    path: /home/iit-t/akshith/CAMB_custom
    extra_args:
      halofit_version: mead
      bbn_predictor: PArthENoPE_880.2_standard.dat
      lens_potential_accuracy: 1
      num_massive_neutrinos: 1
      nnu: 3.046
      theta_H0_range: [20, 100]

# ------------------------------------------------------------
# Likelihoods
# ------------------------------------------------------------
likelihood:
  planck_2018_highl_plik.TTTEEE: {}
  planck_2018_lowl.TT: {}
  planck_2018_lowl.EE: {}

# ------------------------------------------------------------
# Parameters
# ------------------------------------------------------------
params:
  cosmomc_theta:
    prior: {min: 0.0102, max: 0.0107}
    proposal: 5e-6
    ref: 0.01041
  ombh2:
    prior: {min: 0.02, max: 0.024}
    proposal: 0.0001
    ref: 0.0224
  omch2:
    prior: {min: 0.10, max: 0.14}
    proposal: 0.001
    ref: 0.12
  As:
    prior: {min: 1.5e-9, max: 3.5e-9}
    proposal: 1e-10
    ref: 2.1e-9
  ns:
    prior: {min: 0.90, max: 1.05}
    proposal: 0.005
    ref: 0.965
  tau:
    prior: {min: 0.01, max: 0.10}
    proposal: 0.005
    ref: 0.055
  # Fixed grey body parameters - passed at every MCMC step
  use_grey_body_radiation:
    value: 1
  transition_redshift:
    value: 17.0
  # Grey body emissivity - varying parameter
  custom_emissivity:
    prior: {min: 0.5, max: 1}
    proposal: 0.01
    ref: 0.9
    latex: \varepsilon_{\rm CMB}

# ------------------------------------------------------------
# Sampler
# ------------------------------------------------------------
sampler:
  mcmc:
    max_samples: 1000000
    covmat: /mnt/4d0c0e42-f0e1-4724-946d-062888997c6b/akshith_chains/run_with_emissivity.covmat
    learn_proposal: True
    Rminus1_stop: 0.005
    Rminus1_cl_stop: 0.2
    max_tries: 800000

# ------------------------------------------------------------
# Output
# ------------------------------------------------------------
output: /mnt/4d0c0e42-f0e1-4724-946d-062888997c6b/akshith_chains/run_with_emissivity_ttteee_new
packages_path: /home/iit-t/akshith/cobaya_packages
